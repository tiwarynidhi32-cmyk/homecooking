<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>HC Home Cooking - Professional Chef Service</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#E31E24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HC Cooking" />
    <meta name="application-name" content="HC Cooking" />
    <meta name="description" content="Professional chef booking & home cooking management platform in Lucknow" />
    
    <!-- Icons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for Mobile APK & Offline Reliability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('HC Service Worker registered successfully:', reg.scope);
            })
            .catch((err) => {
              console.warn('HC Service Worker registration non-fatal notice:', err);
            });
        });
      }
    </script>
  </body>
</html>
